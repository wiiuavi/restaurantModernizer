services:
  restaurant:
    build: .
    ports:
      - "80:8000"
    env_file:
      - .env
    environment:
      HOST_IP: "0.0.0.0"
      PORT: "8000"
      DATABASE_NAME: "/app/data/masterMenuDatabase.db"
      INITIALIZE_EMPTY_DATABASE: "true"
    volumes:
      - restaurant_data:/app/data
    restart: unless-stopped

volumes:
  restaurant_data:
